<main class="mx-auto max-w-4xl px-4 py-10">

  <div class="mt-8 grid gap-6 md:grid-cols-5">

const LOCALE = {zh:'zh-CN', pt:'pt-BR'};
const CURRENCIES = [
 ['USD','$ USD'],['EUR','€ EUR'],['GBP','£ GBP'],['TRY','₺ TRY'],['JPY','¥ JPY'],['CNY','¥ CNY'],['INR','₹ INR'],
 ['RUB','₽ RUB'],['AED','د.إ AED'],['SAR','﷼ SAR'],['CAD','C$ CAD'],['AUD','A$ AUD'],['CHF','CHF'],['BRL','R$ BRL'],
 ['KRW','₩ KRW'],['SEK','kr SEK'],['MXN','Mex$ MXN'],['SGD','S$ SGD'],['HKD','HK$ HKD'],['PLN','zł PLN']
];
// Sadece ilk açılışta kullanılan varsayılan para birimi önerisi (sonra iki menü bağımsızdır)
const DEF_CUR = {en:'USD',tr:'TRY',es:'EUR',de:'EUR',fr:'EUR',ar:'AED',ru:'RUB',zh:'CNY',ja:'JPY',pt:'BRL',it:'EUR',hi:'INR',ko:'KRW',nl:'EUR',pl:'PLN'};

let lang = 'en', cur = 'USD';
const t = k => T[lang][K.indexOf(k)];

function detectLang() {
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const l of list) {
    const c = String(l).toLowerCase().split('-')[0];
    if (T[c]) return c;
  }
  return 'en';
}

function money(n) {
  try {
    return new Intl.NumberFormat(LOCALE[lang] || lang, {style:'currency', currency:cur, currencyDisplay:'narrowSymbol'}).format(n);
  } catch (e) {
    return n.toFixed(2) + ' ' + cur;
  }
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('langSel').setAttribute('aria-label', t('lng'));
  $('langSel').title = t('lng');
  $('curSel').setAttribute('aria-label', t('cur'));
  $('curSel').title = t('cur');
  hesapla();
}

function hesapla() {
  // KKDF/BSMV seçeneği sadece Türkçe dilinde veya TRY para biriminde görünür
  const trMode = lang === 'tr' || cur === 'TRY';
  $('vergiBox').classList.toggle('hidden', !trMode);
  $('vergiBox').classList.toggle('flex', trMode);

  const P = parseFloat($('tutar').value) || 0;
  const n = Math.max(1, parseInt($('vade').value) || 1);
  let r = (parseFloat($('faiz').value) || 0) / 100;
  if (trMode && $('vergi').checked) r *= 1.30;

  const taksit = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
  const toplam = taksit * n;
  const faizVergi = toplam - P;

  $('tutarEt').textContent = money(P);
  $('vadeEt').textContent = n + ' ' + t('mon');
  $('taksit').textContent = money(taksit);
  $('toplam').textContent = money(toplam);
  $('faizToplam').textContent = money(faizVergi);
  $('bar').style.width = (toplam > 0 ? faizVergi / toplam * 100 : 0) + '%';

  let kalan = P, rows = '';
  for (let i = 1; i <= n; i++) {
    const f = kalan * r;
    const ana = taksit - f;
    kalan = Math.max(0, kalan - ana);
    rows += `<tr><td class="p-3">${i}</td><td class="p-3">${money(taksit)}</td><td class="p-3">${money(ana)}</td><td class="p-3">${money(f)}</td><td class="p-3">${money(kalan)}</td></tr>`;
  }
  $('plan').innerHTML = rows;
}

// Kaydırma çubukları ile kutuları eşle
[['tutar','tutarR'],['vade','vadeR']].forEach(([a,b]) => {
  $(b).addEventListener('input', () => { $(a).value = $(b).value; hesapla(); });
  $(a).addEventListener('input', () => { $(b).value = $(a).value; hesapla(); });
});
$('faiz').addEventListener('input', hesapla);
$('vergi').addEventListener('change', hesapla);

// Para birimi menüsünü doldur
